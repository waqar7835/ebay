services:
  postgres:
    image: postgres:16-alpine
    container_name: ebay-order-management-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebay
      POSTGRES_PASSWORD: ebay
      POSTGRES_DB: ebay_order_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
